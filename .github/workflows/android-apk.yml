name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Lloji i ndërtimit (debug, release, both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'
      build_bundle:
        description: 'Gjenero edhe Android App Bundle (.aab) për Google Play'
        required: false
        default: false
        type: boolean
      gemini_api_key:
        description: 'Gemini API Key (Opsionale: nëse nuk është vendosur te Repository Secrets)'
        required: false
        type: string

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        env:
          VITE_GEMINI_API_KEY: ${{ inputs.gemini_api_key || secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY || vars.VITE_GEMINI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ inputs.gemini_api_key || secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || vars.GEMINI_API_KEY || '' }}
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App (APK/AAB)
        working-directory: ./android
        run: |
          chmod +x gradlew
          
          BUILD_TYPE="${{ github.event.inputs.build_type || inputs.build_type }}"
          BUILD_BUNDLE="${{ github.event.inputs.build_bundle || inputs.build_bundle }}"
          
          # Fallback values if triggered via push/PR instead of workflow_dispatch
          BUILD_TYPE="${BUILD_TYPE:-debug}"
          BUILD_BUNDLE="${BUILD_BUNDLE:-false}"
          
          echo "Build Type to run: $BUILD_TYPE"
          echo "Build Bundle: $BUILD_BUNDLE"
          
          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "--- Po ndërtohet Debug APK ---"
            ./gradlew assembleDebug --stacktrace
          fi
          
          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            echo "--- Po ndërtohet Release APK ---"
            ./gradlew assembleRelease --stacktrace
            
            if [ "$BUILD_BUNDLE" = "true" ]; then
              echo "--- Po ndërtohet Release AAB Bundle ---"
              ./gradlew bundleRelease --stacktrace
            fi
          fi

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoteBook3-Android-Builds
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Po përgatitet publikimi i APK-së në GitHub Releases..."
          
          # Delete existing 'latest-apk' release and tag locally and remotely if they exist
          gh release delete latest-apk --yes || true
          git push --delete origin latest-apk || true
          
          # Sleep briefly to ensure GitHub API processes the deletion
          sleep 3
          
          # Find existing files to attach
          FILES_TO_UPLOAD=""
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            FILES_TO_UPLOAD="$FILES_TO_UPLOAD android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            FILES_TO_UPLOAD="$FILES_TO_UPLOAD android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            FILES_TO_UPLOAD="$FILES_TO_UPLOAD android/app/build/outputs/apk/release/app-release.apk"
          fi
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            FILES_TO_UPLOAD="$FILES_TO_UPLOAD android/app/build/outputs/bundle/release/app-release.aab"
          fi

          echo "Skedarët që do të ngarkohen: $FILES_TO_UPLOAD"

          if [ -n "$FILES_TO_UPLOAD" ]; then
            gh release create latest-apk \
              --title "Bllok Shënimesh - Android App APK (Latest Build)" \
              --notes "Ky është versioni më i fundit i aplikacionit NoteBook për Android (APK) i ndërtuar automatikisht nga GitHub Actions. Shkarkoni 'app-debug.apk' më poshtë për ta instaluar direkt në telefonin tuaj." \
              --prerelease \
              $FILES_TO_UPLOAD || echo "Gabim gjatë krijimit të release, po vazhdojmë..."
          else
            echo "Nuk u gjet asnjë skedar për të ngarkuar në Release!"
          fi



